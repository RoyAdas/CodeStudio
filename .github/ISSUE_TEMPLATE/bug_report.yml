name: Bug report / 问题反馈
description: Report a reproducible problem without including secrets / 提交可复现的问题，请勿包含密钥
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CodeStudio version / 软件版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and browser / Windows 与浏览器
      placeholder: Windows 11 x64, Edge
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation / 安装方式
      options:
        - Release ZIP / 一键启动包
        - Source build / 源码构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the smallest example that shows the problem / 请提供能复现问题的最小示例
      placeholder: "1. Open ...\n2. Click ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime or AI details, if relevant / 相关运行环境或 AI 信息
      description: Tool version, protocol, or model; omit API keys, account identifiers, and private endpoint details / 可填写工具版本、协议或模型，请勿填写密钥、账号或私人接口信息
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots / 已去除私人内容的日志或截图
      description: Do not attach settings.json or the whole data directory / 请勿附上 settings.json 或整个 data 文件夹
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I removed API keys and private content / 已删除 API 密钥和私人内容
          required: true
