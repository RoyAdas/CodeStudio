name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare bundled language services
        run: npm run prepare:languages
      - run: npm run prepare:debugger
      - name: Check types
        run: npm run typecheck
      - name: Build editor
        run: npm run build
      - name: Run logic and API tests
        run: npm test
      - name: Install browser
        run: npx playwright install chromium
      - name: Run mentor browser tests
        run: npm run test:e2e
      - name: Package clean Windows ZIP
        run: npm run package:win
      - name: Verify packaged launcher
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeStudio-windows-x64
          path: |
            releases/CodeStudio-v*-windows-x64.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
